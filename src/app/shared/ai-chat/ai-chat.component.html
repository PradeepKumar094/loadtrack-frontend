<!-- Floating Chat Button -->
<div class="chat-fab" (click)="toggle()" [class.open]="isOpen" title="AI Assistant">
  <i class="fas fa-robot" *ngIf="!isOpen"></i>
  <i class="fas fa-times" *ngIf="isOpen"></i>
  <span class="fab-label" *ngIf="!isOpen">AI</span>
</div>

<!-- Chat Window -->
<div class="chat-window" [class.visible]="isOpen">

  <!-- Header -->
  <div class="chat-header">
    <div class="chat-header-left">
      <div class="ai-avatar"><i class="fas fa-robot"></i></div>
      <div>
        <div class="ai-name">LoadTrack AI</div>
        <div class="ai-status"><span class="status-dot"></span> Online</div>
      </div>
    </div>
    <div class="chat-header-actions">
      <button class="header-btn" (click)="clearChat()" title="Clear chat">
        <i class="fas fa-trash-alt"></i>
      </button>
      <button class="header-btn" (click)="toggle()" title="Close">
        <i class="fas fa-times"></i>
      </button>
    </div>
  </div>

  <!-- Messages -->
  <div class="chat-messages">
    <div *ngFor="let msg of messages" class="message-wrap" [class.user-wrap]="msg.role === 'user'">
      <div class="message" [class.user-msg]="msg.role === 'user'" [class.ai-msg]="msg.role === 'ai'">
        <!-- Loading dots -->
        <div class="typing-dots" *ngIf="msg.loading">
          <span></span><span></span><span></span>
        </div>
        <!-- Message text -->
        <div class="msg-text" *ngIf="!msg.loading">{{ msg.text }}</div>
        <div class="msg-time">{{ msg.time }}</div>
      </div>
    </div>
  </div>

  <!-- Suggestions (shown when no user messages yet) -->
  <div class="suggestions" *ngIf="messages.length <= 1">
    <div class="suggestions-label">Try asking:</div>
    <div class="suggestion-chips">
      <button *ngFor="let s of suggestions" class="chip" (click)="useSuggestion(s)">
        {{ s }}
      </button>
    </div>
  </div>

  <!-- Input -->
  <div class="chat-input-area">
    <input type="text" class="chat-input" [(ngModel)]="question"
           placeholder="Ask anything about your business..."
           (keyup.enter)="send()" [disabled]="loading">
    <button class="send-btn" (click)="send()" [disabled]="!question.trim() || loading">
      <i class="fas fa-paper-plane" *ngIf="!loading"></i>
      <i class="fas fa-spinner fa-spin" *ngIf="loading"></i>
    </button>
  </div>

</div>
