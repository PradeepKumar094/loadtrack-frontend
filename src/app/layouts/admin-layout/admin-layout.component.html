<div class="app-wrapper" [class.sidebar-collapsed]="!sidebarOpen">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <i class="fas fa-truck"></i>
      <span class="brand-text">LoadTrack</span>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section-label">Main</div>

      <a routerLink="/admin/dashboard" routerLinkActive="active" class="nav-item">
        <i class="fas fa-tachometer-alt"></i>
        <span>Dashboard</span>
      </a>

      <div class="nav-section-label">Management</div>

      <a routerLink="/admin/trucks" routerLinkActive="active" class="nav-item">
        <i class="fas fa-truck-moving"></i>
        <span>Trucks</span>
      </a>

      <a routerLink="/admin/drivers" routerLinkActive="active" class="nav-item">
        <i class="fas fa-id-card"></i>
        <span>Drivers</span>
      </a>

      <a routerLink="/admin/dealers" routerLinkActive="active" class="nav-item">
        <i class="fas fa-handshake"></i>
        <span>Dealers</span>
      </a>

      <a routerLink="/admin/sand-types" routerLinkActive="active" class="nav-item">
        <i class="fas fa-layer-group"></i>
        <span>Sand Types</span>
      </a>

      <div class="nav-section-label">Operations</div>

      <a routerLink="/admin/trips" routerLinkActive="active" class="nav-item">
        <i class="fas fa-route"></i>
        <span>Trips</span>
      </a>

      <a routerLink="/admin/sand-requests" routerLinkActive="active" class="nav-item">
        <i class="fas fa-layer-group"></i>
        <span>Sand Requests</span>
      </a>

      <a routerLink="/admin/payments" routerLinkActive="active" class="nav-item">
        <i class="fas fa-rupee-sign"></i>
        <span>Payments</span>
      </a>

      <div class="nav-section-label">Analytics</div>

      <a routerLink="/admin/reports" routerLinkActive="active" class="nav-item">
        <i class="fas fa-chart-bar"></i>
        <span>Reports</span>
      </a>

      <a routerLink="/admin/payment-risk" routerLinkActive="active" class="nav-item ai-nav">
        <i class="fas fa-brain"></i>
        <span>Payment Risk AI</span>
        <span class="ai-badge">AI</span>
      </a>

      <a routerLink="/admin/driver-salary" routerLinkActive="active" class="nav-item">
        <i class="fas fa-wallet"></i>
        <span>Driver Salary</span>
      </a>

      <a routerLink="/admin/settings" routerLinkActive="active" class="nav-item">
        <i class="fas fa-cog"></i>
        <span>Settings</span>
      </a>

      <a routerLink="/admin/profile" routerLinkActive="active" class="nav-item">
        <i class="fas fa-user-circle"></i>
        <span>My Profile</span>
      </a>
    </nav>
  </aside>

  <!-- Main Content -->
  <div class="main-content">

    <!-- Top Navbar -->
    <header class="topbar">
      <button class="toggle-btn" (click)="toggleSidebar()">
        <i class="fas fa-bars"></i>
      </button>

      <div class="topbar-right">
        <div class="user-info">
          <div class="user-avatar">
            <i class="fas fa-user-circle"></i>
          </div>
          <div class="user-details">
            <span class="user-name">{{ authService.getUsername() }}</span>
            <span class="user-role">Admin</span>
          </div>
        </div>
        <button class="logout-btn" (click)="logout()">
          <i class="fas fa-sign-out-alt"></i>
          <span>Logout</span>
        </button>
      </div>
    </header>

    <!-- Page Content -->
    <main class="page-content">
      <router-outlet></router-outlet>
    </main>

  </div>
</div>

<!-- AI Chat Widget (floating, available on all admin pages) -->
<app-ai-chat></app-ai-chat>
