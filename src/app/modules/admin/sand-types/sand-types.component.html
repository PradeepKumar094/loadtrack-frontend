<div class="page-header">
  <div><h1 class="page-title">Sand Types</h1><p class="page-subtitle">Manage sand types and prices</p></div>
  <button class="btn btn-primary" (click)="openAdd()"><i class="fas fa-plus"></i> Add Sand Type</button>
</div>

<div class="alert alert-success" *ngIf="successMsg"><i class="fas fa-check-circle"></i> {{ successMsg }}</div>
<div class="alert alert-danger" *ngIf="errorMsg && !showModal"><i class="fas fa-exclamation-circle"></i> {{ errorMsg }}</div>

<div class="card">
  <div *ngIf="loading" class="loading-state"><i class="fas fa-spinner fa-spin"></i> Loading...</div>
  <div class="table-wrapper" *ngIf="!loading">
    <table>
      <thead><tr><th>#</th><th>Sand Type</th><th>Price Per Ton (₹)</th><th>Actions</th></tr></thead>
      <tbody>
        <tr *ngFor="let s of sandTypes; let i = index">
          <td>{{ i+1 }}</td>
          <td><strong>{{ s.name }}</strong></td>
          <td><span class="price-tag">₹{{ s.pricePerTon | number }}</span></td>
          <td>
            <button class="btn btn-warning btn-sm" (click)="openEdit(s)"><i class="fas fa-edit"></i></button>
            <button class="btn btn-danger btn-sm" (click)="delete(s.id)" style="margin-left:6px"><i class="fas fa-trash"></i></button>
          </td>
        </tr>
        <tr *ngIf="sandTypes.length === 0"><td colspan="4" class="empty-state">No sand types found</td></tr>
      </tbody>
    </table>
  </div>
</div>

<div class="modal-overlay" *ngIf="showModal" (click)="showModal = false">
  <div class="modal" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3 class="modal-title">{{ isEdit ? 'Edit Sand Type' : 'Add Sand Type' }}</h3>
      <button class="modal-close" (click)="showModal = false">&times;</button>
    </div>
    <div class="alert alert-danger" *ngIf="errorMsg">{{ errorMsg }}</div>
    <form (ngSubmit)="save()" #f="ngForm">
      <div class="form-group"><label>Name *</label><input type="text" class="form-control" [(ngModel)]="form.name" name="name" required placeholder="e.g. Fine Sand"></div>
      <div class="form-group"><label>Price Per Ton (₹) *</label><input type="number" class="form-control" [(ngModel)]="form.pricePerTon" name="pricePerTon" required min="1"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="showModal = false">Cancel</button>
        <button type="submit" class="btn btn-primary" [disabled]="f.invalid">{{ isEdit ? 'Update' : 'Add' }}</button>
      </div>
    </form>
  </div>
</div>
